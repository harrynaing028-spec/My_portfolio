<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mood To Music — Login</title>

    <link
        rel="stylesheet"
        href="styles/app.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="login-card">

            <div class="login-logo">

                <div class="login-logo-icon">
                    🎵
                </div>

                <h1>
                    Mood To Music
                </h1>

                <p>
                    Music that matches how you feel.
                </p>

            </div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <input
                            class="form-input"
                            id="email"
                            type="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                        >

                    </div>

                    <div
                        class="form-error"
                        id="emailError"
                    ></div>

                </div>



                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            class="form-input"
                            id="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            ◉
                        </button>

                    </div>

                    <div
                        class="form-error"
                        id="passwordError"
                    ></div>

                </div>


                <!-- REMEMBER ME -->

                <div class="remember-row">

                    <label class="remember-label">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Sign In
                </button>


                <div class="auth-divider">
                    OR
                </div>


                <button
                    type="button"
                    class="primary-btn guest-btn"
                    id="guestBtn"
                >
                    Continue as Guest
                </button>

            </form>

        </div>

    </main>


    <script src="scripts/shared/audio.js"></script>
    <script src="scripts/app/navigation.js"></script>
    <script src="scripts/app/account.js"></script>
    <script src="scripts/app/appearance.js"></script>
    <script src="scripts/app/interface.js"></script>
    <script src="scripts/app/library.js"></script>
    <script src="scripts/app/start.js"></script>

</body>

</html>
