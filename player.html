<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mood To Music</title>

    <link rel="stylesheet" href="styles/player.css">

</head>


<body>


    <!-- =========================================
         CURRENT APPLICATION PAGE
         ========================================= -->

    <iframe
        id="pageFrame"
        src="home.html"
        title="Mood To Music"
    ></iframe>


    <!-- =========================================
         GLOBAL MUSIC PLAYER
         ========================================= -->

    <div id="globalPlayer">


        <!-- NORMAL / MINI PLAYER -->

        <div class="player-top">

            <div
                class="player-info"
                onclick="expandGlobalPlayer()"
            >

                <div
                    class="player-title"
                    id="globalTitle"
                >
                    No song playing
                </div>

                <div
                    class="player-artist"
                    id="globalArtist"
                >
                    Choose a song
                </div>

            </div>


            <div class="player-buttons">

                <button
                    class="player-button"
                    onclick="previousGlobalSong()"
                    title="Previous"
                >
                    ⏮
                </button>


                <button
                    class="player-button main-play"
                    id="globalPlayBtn"
                    onclick="toggleGlobalPlay()"
                >
                    ▶
                </button>


                <button
                    class="player-button"
                    onclick="nextGlobalSong()"
                    title="Next"
                >
                    ⏭
                </button>


                <button
                    class="player-button"
                    onclick="expandGlobalPlayer()"
                    title="Expand"
                >
                    ▲
                </button>

            </div>

        </div>


        <!-- PROGRESS -->

        <div class="global-progress">

            <span
                class="global-time"
                id="globalCurrentTime"
            >
                00:00
            </span>


            <input
                type="range"
                id="globalSeek"
                min="0"
                max="100"
                value="0"
                oninput="seekGlobalSong(this.value)"
            >


            <span
                class="global-time"
                id="globalDuration"
            >
                00:00
            </span>

        </div>


        <!-- EXPANDED -->

        <div class="global-player-full">

            <div class="expanded-title">

                <h2 id="expandedTitle">
                    No song playing
                </h2>

                <p id="expandedArtist">
                    Choose a song
                </p>

            </div>


            <div class="expanded-controls">

                <button
                    class="player-button"
                    onclick="previousGlobalSong()"
                >
                    ⏮
                </button>


                <button
                    class="player-button main-play"
                    id="expandedPlayBtn"
                    onclick="toggleGlobalPlay()"
                >
                    ▶
                </button>


                <button
                    class="player-button"
                    onclick="nextGlobalSong()"
                >
                    ⏭
                </button>


                <button
                    class="player-button"
                    onclick="minimizeGlobalPlayer()"
                >
                    ▼
                </button>

            </div>

        </div>

    </div>




    <audio
        id="globalAudio"
        preload="metadata"
        aria-label="Mood To Music audio player"
    ></audio>

    <script src="scripts/shared/audio.js"></script>
    <script src="scripts/player.js"></script>

</body>

</html>
